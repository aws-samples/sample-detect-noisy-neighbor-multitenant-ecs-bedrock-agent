[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sample-detect-noisy-neighbor-multitenant-ecs-bedrock-agent"
version = "0.1.0"
description = "AI agent that detects and remediates noisy-neighbor conditions in multi-tenant Amazon ECS using Amazon Bedrock"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34",
    "botocore>=1.34",
    "strands-agents>=0.1.0",
    "pydantic>=2.6",
    "requests>=2.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "moto[dynamodb,ecs,sns]>=5.0",
    "responses>=0.25",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-requests",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["agent*", "lambda_invoker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S"]
# S101: assert used — fine in tests; scoped below.
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]
# Dev-only load generator: opens a known ALB URL and is best-effort by design.
"sample_workload/loadgen/*" = ["S310", "S110"]

[tool.mypy]
python_version = "3.11"
strict = true
