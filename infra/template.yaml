AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Noisy-neighbor AI agent — tenant registry, AMP workspace,
  two-tenant sample ECS workload, CloudWatch alarm, EventBridge trigger, SNS
  approval topic, Bedrock guardrail, and the least-privilege agent Lambda.
  Networking (VPC/subnets) is supplied as parameters and is not created here.

# ---------------------------------------------------------------------------
Parameters:
  Environment:
    Type: String
    AllowedValues: [dev, prod]
    Default: dev
    Description: dev auto-remediates; prod publishes an SNS proposal for approval.

  VpcId:
    Type: AWS::EC2::VPC::Id
  PrivateSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Two+ private subnets (across AZs) for the ECS tasks.
  PublicSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Two+ public subnets for the internal-facing ALB.
  AlbIngressCidr:
    Type: String
    Default: 10.0.0.0/8
    AllowedPattern: ^([0-9]{1,3}\.){3}[0-9]{1,3}/([0-9]|[1-2][0-9]|3[0-2])$
    Description: CIDR permitted to reach the ALB. Do NOT use 0.0.0.0/0.

  BedrockModelId:
    Type: String
    Default: us.anthropic.claude-sonnet-4-5-20250929-v1:0
    Description: Claude inference-profile ID on Amazon Bedrock.

  CertificateArn:
    Type: String
    AllowedPattern: ^arn:aws:acm:[a-z0-9-]+:[0-9]{12}:certificate/.+$
    Description: >-
      ACM certificate ARN for the ALB HTTPS listener (TLS 1.2+). The ALB is
      internal, so a public domain / Route 53 record is optional — an
      ACM Private CA certificate works and is often the simplest fit. Route 53
      is only needed if you want clients to validate against a friendly
      hostname.

  AppImage:
    Type: String
    Description: Sample workload image, MUST be digest-pinned (repo@sha256:...).
    AllowedPattern: ^.+@sha256:[a-f0-9]{64}$
  AdotImage:
    Type: String
    Description: ADOT collector image, MUST be digest-pinned (repo@sha256:...).
    AllowedPattern: ^.+@sha256:[a-f0-9]{64}$

  LambdaCodeBucket:
    Type: String
    Description: S3 bucket holding the packaged agent Lambda zip.
  LambdaCodeKey:
    Type: String
    Description: S3 key of the packaged agent Lambda zip.

  ApprovalEmail:
    Type: String
    Default: ""
    Description: Optional email subscribed to the SNS proposal topic.

  MaxDesiredCount:
    Type: Number
    Default: 20
    MinValue: 1
    Description: Hard cap the agent may scale a service to.

Conditions:
  IsProd: !Equals [!Ref Environment, prod]
  HasApprovalEmail: !Not [!Equals [!Ref ApprovalEmail, ""]]

# ---------------------------------------------------------------------------
Resources:

  # ---- KMS key for SNS/logs encryption -----------------------------------
  DataKey:
    Type: AWS::KMS::Key
    Properties:
      Description: !Sub "${AWS::StackName} noisy-neighbor data key"
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: EnableRootAccountAdmin
            Effect: Allow
            Principal: { AWS: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:root" }
            Action: "kms:*"
            Resource: "*"
          # Service-principal statements are pinned to this stack's resources
          # (confused-deputy protection). The log-group names and topic name are
          # deterministic, so the ARNs can be built with !Sub without creating
          # circular references back to the key.
          - Sid: AllowCloudWatchLogs
            Effect: Allow
            Principal: { Service: !Sub "logs.${AWS::Region}.amazonaws.com" }
            Action: ["kms:Encrypt", "kms:Decrypt", "kms:GenerateDataKey*", "kms:Describe*"]
            Resource: "*"
            Condition:
              ArnLike:
                kms:EncryptionContext:aws:logs:arn:
                  - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/ecs/${AWS::StackName}/sample-workload"
                  - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}-agent"
          - Sid: AllowSns
            Effect: Allow
            Principal: { Service: "sns.amazonaws.com" }
            Action: ["kms:Decrypt", "kms:GenerateDataKey*"]
            Resource: "*"
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref "AWS::AccountId"
              ArnLike:
                aws:SourceArn: !Sub "arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:${AWS::StackName}-remediation-proposals"

  # ---- Tenant registry ----------------------------------------------------
  TenantRegistry:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-tenant-registry"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: tenant_id, AttributeType: S }
      KeySchema:
        - { AttributeName: tenant_id, KeyType: HASH }
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: !Ref DataKey
      DeletionProtectionEnabled: !If [IsProd, true, false]

  # ---- AMP workspace ------------------------------------------------------
  PrometheusWorkspace:
    Type: AWS::APS::Workspace
    Properties:
      Alias: !Sub "${AWS::StackName}-tenant-metrics"

  # ---- SNS approval / alert topic ----------------------------------------
  ProposalTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "${AWS::StackName}-remediation-proposals"
      KmsMasterKeyId: !Ref DataKey

  ProposalSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasApprovalEmail
    Properties:
      TopicArn: !Ref ProposalTopic
      Protocol: email
      Endpoint: !Ref ApprovalEmail

  # ---- Networking: security groups ---------------------------------------
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ALB ingress for the sample workload
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref AlbIngressCidr
          Description: HTTPS ingress (TLS terminated at the ALB)
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          DestinationSecurityGroupId: !Ref TaskSecurityGroup
          Description: To tasks only

  TaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ECS tasks for the sample workload
      VpcId: !Ref VpcId

  TaskIngressFromAlb:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref TaskSecurityGroup
      IpProtocol: tcp
      FromPort: 8080
      ToPort: 8080
      SourceSecurityGroupId: !Ref AlbSecurityGroup
      Description: App port from ALB

  TaskEgressHttps:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref TaskSecurityGroup
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      CidrIp: 0.0.0.0/0
      Description: Egress to AWS APIs (AMP remote_write, ECR) over TLS

  # ---- ALB ----------------------------------------------------------------
  Alb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    # checkov:skip=CKV_AWS_91: Access logging requires a dedicated S3 log bucket
    #   with its own lifecycle/retention. For this internal demo ALB it is left
    #   to the adopter; enable access_logs.s3.* pointing at a managed log bucket
    #   in production.
    Properties:
      Scheme: internal
      Type: application
      Subnets: !Ref PublicSubnetIds
      SecurityGroups: [!Ref AlbSecurityGroup]
      LoadBalancerAttributes:
        - { Key: routing.http.drop_invalid_header_fields.enabled, Value: "true" }

  TenantATargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VpcId
      Port: 8080
      Protocol: HTTP
      TargetType: ip
      HealthCheckPath: /health
      TargetGroupAttributes:
        - { Key: load_balancing.algorithm.type, Value: least_outstanding_requests }

  TenantBTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VpcId
      Port: 8080
      Protocol: HTTP
      TargetType: ip
      HealthCheckPath: /health
      TargetGroupAttributes:
        - { Key: load_balancing.algorithm.type, Value: least_outstanding_requests }

  AlbListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref Alb
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates:
        - CertificateArn: !Ref CertificateArn
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TenantATargetGroup

  TenantBListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref AlbListener
      Priority: 10
      Conditions:
        - Field: http-header
          HttpHeaderConfig:
            HttpHeaderName: X-Tenant-Id
            Values: ["tenant-b"]
      Actions:
        - Type: forward
          TargetGroupArn: !Ref TenantBTargetGroup

  # ---- ECS cluster + services --------------------------------------------
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub "${AWS::StackName}-shared-cluster"
      ClusterSettings:
        - { Name: containerInsights, Value: enabled }

  AppLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/${AWS::StackName}/sample-workload"
      RetentionInDays: 30
      KmsKeyId: !GetAtt DataKey.Arn

  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy"
      Policies:
        - PolicyName: logs-kms
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ["kms:Decrypt", "kms:GenerateDataKey*"]
                Resource: !GetAtt DataKey.Arn

  # Task role — only what the ADOT sidecar needs: remote_write to this workspace.
  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: amp-remote-write
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ["aps:RemoteWrite"]
                Resource: !GetAtt PrometheusWorkspace.Arn

  TenantATaskDef:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${AWS::StackName}-svc-a"
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: "512"
      Memory: "1024"
      RuntimePlatform: { CpuArchitecture: ARM64, OperatingSystemFamily: LINUX }
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: app
          Image: !Ref AppImage
          Essential: true
          Environment:
            - { Name: TENANT_ID, Value: tenant-a }
            - { Name: SERVICE_NAME, Value: !Sub "${AWS::StackName}-svc-a" }
          PortMappings: [{ ContainerPort: 8080 }]
          ReadonlyRootFilesystem: true
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref AppLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: svc-a
        - Name: adot
          Image: !Ref AdotImage
          Essential: true
          # The collector renders AOT_CONFIG_CONTENT to a file at startup, so
          # this sidecar cannot use a read-only root filesystem.
          ReadonlyRootFilesystem: false
          Environment:
            - { Name: AWS_REGION, Value: !Ref AWS::Region }
            - Name: AOT_CONFIG_CONTENT
              Value: !Sub |
                extensions:
                  sigv4auth:
                    region: ${AWS::Region}
                    service: aps
                receivers:
                  prometheus:
                    config:
                      scrape_configs:
                        - job_name: sample-workload
                          scrape_interval: 15s
                          static_configs:
                            - targets: ['127.0.0.1:8080']
                processors:
                  batch/metrics:
                    timeout: 30s
                exporters:
                  prometheusremotewrite:
                    endpoint: ${PrometheusWorkspace.PrometheusEndpoint}api/v1/remote_write
                    auth:
                      authenticator: sigv4auth
                service:
                  extensions: [sigv4auth]
                  pipelines:
                    metrics:
                      receivers: [prometheus]
                      processors: [batch/metrics]
                      exporters: [prometheusremotewrite]
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref AppLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: svc-a-adot

  TenantBTaskDef:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${AWS::StackName}-svc-b"
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: "512"
      Memory: "1024"
      RuntimePlatform: { CpuArchitecture: ARM64, OperatingSystemFamily: LINUX }
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: app
          Image: !Ref AppImage
          Essential: true
          Environment:
            - { Name: TENANT_ID, Value: tenant-b }
            - { Name: SERVICE_NAME, Value: !Sub "${AWS::StackName}-svc-b" }
          PortMappings: [{ ContainerPort: 8080 }]
          ReadonlyRootFilesystem: true
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref AppLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: svc-b
        - Name: adot
          Image: !Ref AdotImage
          Essential: true
          # The collector renders AOT_CONFIG_CONTENT to a file at startup, so
          # this sidecar cannot use a read-only root filesystem.
          ReadonlyRootFilesystem: false
          Environment:
            - { Name: AWS_REGION, Value: !Ref AWS::Region }
            - Name: AOT_CONFIG_CONTENT
              Value: !Sub |
                extensions:
                  sigv4auth:
                    region: ${AWS::Region}
                    service: aps
                receivers:
                  prometheus:
                    config:
                      scrape_configs:
                        - job_name: sample-workload
                          scrape_interval: 15s
                          static_configs:
                            - targets: ['127.0.0.1:8080']
                processors:
                  batch/metrics:
                    timeout: 30s
                exporters:
                  prometheusremotewrite:
                    endpoint: ${PrometheusWorkspace.PrometheusEndpoint}api/v1/remote_write
                    auth:
                      authenticator: sigv4auth
                service:
                  extensions: [sigv4auth]
                  pipelines:
                    metrics:
                      receivers: [prometheus]
                      processors: [batch/metrics]
                      exporters: [prometheusremotewrite]
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref AppLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: svc-b-adot

  TenantAService:
    Type: AWS::ECS::Service
    DependsOn: AlbListener
    Properties:
      ServiceName: !Sub "${AWS::StackName}-svc-a"
      Cluster: !Ref Cluster
      TaskDefinition: !Ref TenantATaskDef
      DesiredCount: 2
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets: !Ref PrivateSubnetIds
          SecurityGroups: [!Ref TaskSecurityGroup]
      LoadBalancers:
        - ContainerName: app
          ContainerPort: 8080
          TargetGroupArn: !Ref TenantATargetGroup

  TenantBService:
    Type: AWS::ECS::Service
    DependsOn: TenantBListenerRule
    Properties:
      ServiceName: !Sub "${AWS::StackName}-svc-b"
      Cluster: !Ref Cluster
      TaskDefinition: !Ref TenantBTaskDef
      DesiredCount: 2
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets: !Ref PrivateSubnetIds
          SecurityGroups: [!Ref TaskSecurityGroup]
      LoadBalancers:
        - ContainerName: app
          ContainerPort: 8080
          TargetGroupArn: !Ref TenantBTargetGroup

  # ---- Bedrock guardrail --------------------------------------------------
  AgentGuardrail:
    Type: AWS::Bedrock::Guardrail
    Properties:
      Name: !Sub "${AWS::StackName}-agent-guardrail"
      Description: Constrains the noisy-neighbor agent's model output.
      BlockedInputMessaging: "Request blocked by guardrail."
      BlockedOutputsMessaging: "Response blocked by guardrail."
      ContentPolicyConfig:
        FiltersConfig:
          - { Type: PROMPT_ATTACK, InputStrength: HIGH, OutputStrength: NONE }

  # ---- Agent Lambda -------------------------------------------------------
  AgentDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${AWS::StackName}-agent-dlq"
      KmsMasterKeyId: !Ref DataKey
      MessageRetentionPeriod: 1209600  # 14 days

  AgentLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-agent"
      RetentionInDays: 30
      KmsKeyId: !GetAtt DataKey.Arn

  AgentRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: agent-least-privilege
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: Logs
                Effect: Allow
                Action: ["logs:CreateLogStream", "logs:PutLogEvents"]
                Resource: !GetAtt AgentLogGroup.Arn
              - Sid: ListTenants
                Effect: Allow
                Action: ["dynamodb:Scan", "dynamodb:GetItem"]
                Resource: !GetAtt TenantRegistry.Arn
              - Sid: QueryMetrics
                Effect: Allow
                Action: ["aps:QueryMetrics", "aps:GetLabels", "aps:GetSeries"]
                Resource: !GetAtt PrometheusWorkspace.Arn
              - Sid: ScaleServices
                Effect: Allow
                Action: ["ecs:UpdateService", "ecs:DescribeServices"]
                Resource:
                  - !Ref TenantAService
                  - !Ref TenantBService
              - Sid: PublishProposals
                Effect: Allow
                Action: ["sns:Publish"]
                Resource: !Ref ProposalTopic
              - Sid: PublishKms
                Effect: Allow
                Action: ["kms:GenerateDataKey*", "kms:Decrypt"]
                Resource: !GetAtt DataKey.Arn
              - Sid: DeadLetter
                Effect: Allow
                Action: ["sqs:SendMessage"]
                Resource: !GetAtt AgentDlq.Arn
              - Sid: InvokeModel
                Effect: Allow
                Action: ["bedrock:InvokeModel", "bedrock:InvokeModelWithResponseStream"]
                # Cross-region inference profiles (us.anthropic.*) route the call
                # to a foundation-model in any of the profile's Regions
                # (us-east-1/us-east-2/us-west-2), so the foundation-model ARN
                # must allow all Regions — not just the deploy Region.
                Resource:
                  - !Sub "arn:${AWS::Partition}:bedrock:*::foundation-model/*"
                  - !Sub "arn:${AWS::Partition}:bedrock:*:${AWS::AccountId}:inference-profile/*"
              - Sid: ApplyGuardrail
                Effect: Allow
                Action: ["bedrock:ApplyGuardrail"]
                Resource: !GetAtt AgentGuardrail.GuardrailArn

  AgentFunction:
    Type: AWS::Lambda::Function
    DependsOn: AgentLogGroup
    # checkov:skip=CKV_AWS_117: Agent Lambda calls Bedrock/DynamoDB/ECS/SNS/AMP
    #   over public AWS endpoints. Placing it in a VPC requires interface
    #   endpoints for each service; that is a deploy-time networking decision
    #   left to the adopter. Add VpcConfig + endpoints for a locked-down prod.
    Properties:
      FunctionName: !Sub "${AWS::StackName}-agent"
      Runtime: python3.13
      Architectures: [arm64]
      Handler: lambda_invoker.handler.handler
      MemorySize: 512
      Timeout: 120
      ReservedConcurrentExecutions: 5
      Role: !GetAtt AgentRole.Arn
      KmsKeyArn: !GetAtt DataKey.Arn
      DeadLetterConfig:
        TargetArn: !GetAtt AgentDlq.Arn
      Code:
        S3Bucket: !Ref LambdaCodeBucket
        S3Key: !Ref LambdaCodeKey
      Environment:
        Variables:
          ENV: !Ref Environment
          BEDROCK_MODEL_ID: !Ref BedrockModelId
          TENANT_REGISTRY_TABLE: !Ref TenantRegistry
          AMP_WORKSPACE_URL: !GetAtt PrometheusWorkspace.PrometheusEndpoint
          SNS_TOPIC_ARN: !Ref ProposalTopic
          GUARDRAIL_ID: !GetAtt AgentGuardrail.GuardrailId
          MAX_DESIRED_COUNT: !Ref MaxDesiredCount

  # ---- Trigger: CloudWatch alarm -> EventBridge -> Lambda -----------------
  ClusterCpuAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-shared-cluster-cpu-high"
      Namespace: AWS/ECS
      MetricName: CPUUtilization
      Dimensions:
        - Name: ClusterName
          Value: !Ref Cluster
      Statistic: Average
      Period: 60
      EvaluationPeriods: 1
      Threshold: 70
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  AlarmRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${AWS::StackName}-alarm-to-agent"
      EventPattern:
        source: ["aws.cloudwatch"]
        detail-type: ["CloudWatch Alarm State Change"]
        resources: [!GetAtt ClusterCpuAlarm.Arn]
        detail:
          state:
            value: ["ALARM"]
      Targets:
        - Arn: !GetAtt AgentFunction.Arn
          Id: agent

  AlarmRulePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AgentFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt AlarmRule.Arn

# ---------------------------------------------------------------------------
Outputs:
  ClusterName:
    Value: !Ref Cluster
  AlbDnsName:
    Value: !GetAtt Alb.DNSName
  TenantRegistryTable:
    Value: !Ref TenantRegistry
  PrometheusEndpoint:
    Value: !GetAtt PrometheusWorkspace.PrometheusEndpoint
  ProposalTopicArn:
    Value: !Ref ProposalTopic
  AgentFunctionName:
    Value: !Ref AgentFunction
