# ADOT Collector config — runs as a sidecar in each tenant's ECS task.
#
# Scrapes the app's /metrics endpoint on localhost (same task, awsvpc network)
# and remote-writes to Amazon Managed Service for Prometheus with SigV4.
#
# The `tenant_id` label is emitted by the application itself; the collector only
# adds cluster/service context. Keep the label set small — no high-cardinality
# labels (user id, order id).
extensions:
  sigv4auth:
    region: "${AWS_REGION}"
    service: "aps"

receivers:
  prometheus:
    config:
      scrape_configs:
        - job_name: "sample-workload"
          scrape_interval: 15s
          static_configs:
            - targets: ["127.0.0.1:8080"]
          metric_relabel_configs:
            # Defense-in-depth: drop any accidentally-high-cardinality labels.
            - action: labeldrop
              regex: "user_id|order_id|request_id"

processors:
  resourcedetection:
    detectors: ["env", "ecs"]
    timeout: 5s
  batch/metrics:
    timeout: 30s

exporters:
  prometheusremotewrite:
    endpoint: "${AMP_REMOTE_WRITE_URL}"
    auth:
      authenticator: sigv4auth
    resource_to_telemetry_conversion:
      enabled: true

service:
  extensions: ["sigv4auth"]
  pipelines:
    metrics:
      receivers: ["prometheus"]
      processors: ["resourcedetection", "batch/metrics"]
      exporters: ["prometheusremotewrite"]
  telemetry:
    logs:
      level: "warn"
